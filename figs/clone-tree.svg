<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Nested stem-cell clones</title>
  <desc id="desc">An ancestral haematopoietic stem cell branches into unrelated stem cells and a DNMT3A-mutated clone. A descendant acquires a hypothetical TET2 mutation, forming a nested subclone. Both clones contain stem cells and mature blood cells.</desc>
  <rect x="1.5" y="1.5" width="757" height="457" rx="14" fill="#ffffff" stroke="#c7d4de" stroke-width="3"/>
  <text x="32" y="43" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="20" font-weight="700">Stem-cell lineage</text>
  <path d="M 460 35 H 700" fill="none" stroke="#9cabb6" stroke-width="2"/>
  <path d="M 700 35 l -10 -6 v 12 z" fill="#9cabb6"/>
  <text x="570" y="26" fill="#536575" font-family="Source Sans Pro, Arial, sans-serif" font-size="16" text-anchor="middle">time</text>

  <rect x="190" y="137" width="555" height="302" rx="30" fill="#fdf3e6" stroke="#d98c2b" stroke-width="2.5"/>
  <text x="214" y="168" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="20" font-weight="700">Clone A</text>
  <text x="309" y="168" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="18">DNMT3A+</text>
  <rect x="420" y="282" width="310" height="145" rx="24" fill="#eef3f8" stroke="#1b5e8c" stroke-width="2.5"/>
  <text x="444" y="308" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="19" font-weight="700">Subclone B</text>
  <text x="444" y="329" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="16">DNMT3A+ · TET2+</text>

  <path d="M 79 225 C 120 225 135 98 190 98 H 273" fill="none" stroke="#516474" stroke-width="3" stroke-linecap="round"/>
  <path d="M 79 225 H 247" fill="none" stroke="#516474" stroke-width="3" stroke-linecap="round"/>
  <path d="M 263 225 C 320 225 345 217 426 217" fill="none" stroke="#b8681f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 263 225 C 320 225 345 263 426 263" fill="none" stroke="#b8681f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 263 225 C 325 225 350 366 454 366" fill="none" stroke="#b8681f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 470 366 C 510 366 545 356 587 356" fill="none" stroke="#1b5e8c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 470 366 C 510 366 545 401 587 401" fill="none" stroke="#1b5e8c" stroke-width="3" stroke-linecap="round"/>

  <circle cx="64" cy="225" r="17" fill="#ffffff" stroke="#516474" stroke-width="3"/>
  <text x="26" y="268" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="18" font-weight="600">HSC</text>
  <circle cx="282" cy="98" r="10" fill="#ffffff" stroke="#516474" stroke-width="2.5"/>
  <circle cx="302" cy="89" r="10" fill="#ffffff" stroke="#516474" stroke-width="2.5"/>
  <circle cx="302" cy="108" r="10" fill="#ffffff" stroke="#516474" stroke-width="2.5"/>
  <text x="329" y="105" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="17">other HSCs</text>

  <circle cx="255" cy="225" r="17" fill="#d98c2b"/>
  <path d="M 255 215 v 20 M 245 225 h 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="285" y="203" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="18" font-weight="600">DNMT3A mutation</text>
  <circle cx="462" cy="366" r="17" fill="#1b5e8c"/>
  <path d="M 462 356 v 20 M 452 366 h 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="483" y="346" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="16">TET2 mutation</text>

  <g fill="#ffffff" stroke="#b8681f" stroke-width="2.5">
    <circle cx="436" cy="217" r="10"/><circle cx="455" cy="208" r="10"/><circle cx="455" cy="226" r="10"/>
    <circle cx="436" cy="263" r="10"/><circle cx="455" cy="254" r="10"/><circle cx="455" cy="272" r="10"/>
  </g>
  <text x="486" y="224" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="17">HSCs</text>
  <text x="486" y="270" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="17">blood cells</text>
  <g fill="#ffffff" stroke="#1b5e8c" stroke-width="2.5">
    <circle cx="597" cy="356" r="10"/><circle cx="616" cy="347" r="10"/><circle cx="616" cy="365" r="10"/>
    <circle cx="597" cy="401" r="10"/><circle cx="616" cy="392" r="10"/><circle cx="616" cy="410" r="10"/>
  </g>
  <text x="638" y="363" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="16">HSCs</text>
  <text x="638" y="408" fill="#12324d" font-family="Source Sans Pro, Arial, sans-serif" font-size="16">blood cells</text>

  
</svg>
